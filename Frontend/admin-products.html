<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage products — Woober</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="user.css">
</head>
<body class="user-page" id="top">

  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-fallback">woober<span>.</span></span></a>
    <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="main-nav"><a href="index.html">Home</a><a href="products.html">Products</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav>
    <!-- The login / logout buttons and the links for logged-in users are added by JS/api.js -->
    <div class="header-actions"></div>
  </header>

  <main>
    <section class="user-hero">
      <div class="section-wrap">
        <span class="eyebrow">ADMIN</span>
        <h1>Manage products</h1>
        <p>Add new products, edit their details or remove them.</p>
      </div>
    </section>

    <div class="section-wrap user-main">
      <div class="manage-layout">

        <!-- Form: used for both adding a new product and editing an existing one (see admin-products.js) -->
        <form class="form-card" id="productForm">
          <span class="section-kicker" id="formKicker">ADD NEW PRODUCT</span>

          <label for="name">Name</label>
          <input id="name" required maxlength="100" placeholder="e.g. Linen summer shirt">

          <label for="price">Price (₹)</label>
          <input id="price" type="number" required min="0" step="0.01" placeholder="e.g. 799">

          <label for="stock">Stock (how many in the shop)</label>
          <input id="stock" type="number" required min="0" step="1" placeholder="e.g. 20">

          <label for="description">Description</label>
          <textarea id="description" maxlength="1000" placeholder="Describe this product"></textarea>

          <label for="image">Image</label>
          <input id="image" type="file" accept="image/jpeg,image/png,image/gif,image/webp">
          <p class="field-hint" id="imageHint">JPG, PNG, GIF or WebP, up to 5 MB.</p>

          <div class="form-actions">
            <button class="button button-blue" type="submit" id="submitBtn">Add product</button>
            <button class="button button-outline" type="button" id="cancelBtn" hidden>Cancel</button>
          </div>
          <p class="form-message" id="formMessage" aria-live="polite"></p>
        </form>

        <!-- List of the products with Edit and Delete buttons (filled in by admin-products.js) -->
        <section class="panel">
          <div class="panel-head">
            <h2>All products</h2>
            <span id="count" class="chip"></span>
          </div>
          <div id="list"></div>
        </section>

      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <p>© <span class="year"></span> Woober. All rights reserved.</p>
      <a href="index.html">Back to home ↑</a>
    </div>
  </footer>

  <script src="JS/api.js"></script>
  <script src="JS/script.js"></script>
  <script src="JS/admin-products.js"></script>
</body>
</html>
