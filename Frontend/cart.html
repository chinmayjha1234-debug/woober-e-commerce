<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My cart — Woober</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="user.css">
</head>
<body class="user-page" id="top">

  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-fallback">woober<span>.</span></span></a>
    <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="main-nav"><a href="index.html">Home</a><a href="products.html">Products</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav>
    <!-- The login / logout buttons and the links for logged-in users are added by JS/api.js -->
    <div class="header-actions"></div>
  </header>

  <main>
    <section class="user-hero">
      <div class="section-wrap">
        <span class="eyebrow">SHOPPING CART</span>
        <h1>My cart</h1>
        <p>Check your items, then place your order.</p>
      </div>
    </section>

    <div class="section-wrap user-main">
      <p id="pageMessage" class="form-message" aria-live="polite"></p>
      <div class="cart-layout">
        <section class="panel">
          <h2>Items</h2>
          <div id="cartList"><p class="empty">Loading...</p></div>
        </section>
        <aside class="panel cart-summary" id="summary" hidden>
          <h2>Order summary</h2>
          <p class="summary-line"><span>Items</span><span id="itemCount"></span></p>
          <p class="summary-line total-line"><span>Total</span><span id="total"></span></p>
          <button class="button" id="orderBtn" type="button">Place order</button>
          <a class="text-link" href="products.html">Continue shopping</a>
        </aside>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <p>© <span class="year"></span> Woober. All rights reserved.</p>
      <a href="index.html">Back to home ↑</a>
    </div>
  </footer>

  <script src="JS/api.js"></script>
  <script src="JS/script.js"></script>
  <script src="JS/cart.js"></script>
</body>
</html>
