<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Log in — Woober</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="login.css">
</head>

<body class="auth-page">
    <header class="site-header"><a class="brand" href="index.html"><span
                class="brand-fallback">woober<span>.</span></span></a><a class="text-link" href="index.html">← Back to
            home</a></header>
    <main class="auth-main">
        <form class="form-card auth-card" id="loginForm"><span class="section-kicker">WELCOME BACK</span>
            <h1>Log in to Woober</h1>
            <p>Pick up where you left off.</p><label for="loginEmail">Email address</label><input id="loginEmail"
                type="email" required placeholder="you@example.com"><label for="loginPassword">Password</label><input
                id="loginPassword" type="password" required minlength="6" placeholder="Enter your password">
            <button class="button button-blue" type="submit">Log in →</button>
            <p class="form-message error" id="loginMessage" aria-live="polite"></p>
            <p class="signup-line">New to Woober? <a href="register.html">Create an account</a></p>
        </form>
    </main>
    <footer class="auth-footer">© <span class="year"></span> Woober. All rights reserved.</footer>
    <script src="JS/api.js"></script>
    <script src="JS/script.js"></script>
</body>

</html>
